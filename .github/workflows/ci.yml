name: CI

on:
  pull_request:
  push:
    branches: [master, main]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Ruumly.Backend.Tests/Ruumly.Backend.Tests.csproj

      - name: Build
        run: dotnet build Ruumly.Backend.Tests/Ruumly.Backend.Tests.csproj --no-restore

      - name: Test
        run: dotnet test Ruumly.Backend.Tests/Ruumly.Backend.Tests.csproj --no-build --no-restore
        env:
          RUUMLY_TEST_PG: Host=127.0.0.1;Port=5432;Database=postgres;Username=test;Password=test
